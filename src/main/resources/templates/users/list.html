<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}">

<head>

    <title th:text="${pageTitle}">
        Users
    </title>

</head>

<body>

<div layout:fragment="content">

    <!-- ================================================== -->
    <!-- PAGE HEADER                                        -->
    <!-- ================================================== -->

    <div class="d-flex justify-content-between
                align-items-center mb-4">

        <div>

            <h1 class="h3 mb-1">

                <i class="bi"
                   th:classappend="${pageType == 'admins'}
                       ? ' bi-person-badge'
                       : ' bi-people'">
                </i>

                <span th:text="${pageTitle}">
                    Users
                </span>

            </h1>

            <p class="text-muted mb-0"
               th:text="${pageDescription}">
                Users available to you.
            </p>

        </div>


        <!-- Add user is ADMIN only -->

        <div sec:authorize="hasRole('ADMIN')">

            <a
                th:href="@{/users/new}"
                class="btn btn-primary">

                <i class="bi bi-person-plus"></i>

                Add User

            </a>

        </div>

    </div>


    <!-- ================================================== -->
    <!-- USER TABLE                                         -->
    <!-- ================================================== -->

    <div class="card shadow-sm">

        <div class="card-header bg-white">

            <div class="d-flex
                        justify-content-between
                        align-items-center">

                <span>

                    <i class="bi bi-list-ul"></i>

                    User Accounts

                </span>

                <span
                    class="badge bg-secondary"
                    th:text="${#lists.size(users)}">

                    0

                </span>

            </div>

        </div>


        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover
                              align-middle mb-0">

                    <thead class="table-light">

                    <tr>

                        <th>ID</th>

                        <th>Username</th>

                        <th>Role</th>

                        <th>Status</th>

                        <th>Created</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="user : ${users}">

                        <td th:text="${user.id}">
                            1
                        </td>

                        <td>

                            <i class="bi bi-person-circle"></i>

                            <span
                                th:text="${user.username}">
                                user
                            </span>

                        </td>

                        <td>

                            <span
                                class="badge"
                                th:classappend="${user.role.name() == 'ADMIN'}
                                    ? ' bg-danger'
                                    : ' bg-primary'"
                                th:text="${user.role}">
                                STAFF
                            </span>

                        </td>

                        <td>

                            <span
                                th:if="${user.enabled}"
                                class="badge bg-success">

                                <i class="bi bi-check-circle"></i>

                                Active

                            </span>

                            <span
                                th:unless="${user.enabled}"
                                class="badge bg-secondary">

                                Disabled

                            </span>

                        </td>

                        <td
                            th:text="${#temporals.format(
                                user.createdAt,
                                'dd-MM-yyyy HH:mm')}">

                            10-08-2026 12:00

                        </td>

                    </tr>


                    <tr th:if="${#lists.isEmpty(users)}">

                        <td
                            colspan="5"
                            class="text-center
                                   text-muted
                                   py-5">

                            <i class="bi bi-inbox fs-2"></i>

                            <div class="mt-2">

                                No users found.

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
