<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}"><head><title>Add User</title></head><body><div layout:fragment="content"><div class="row justify-content-center"><div class="col-md-7"><h1 class="h3 mb-4">Add User</h1><p class="text-muted">New accounts require administrator approval before they can sign in.</p><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="card shadow-sm"><div class="card-body"><form th:action="@{/users/new}" method="post"><div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" th:value="${username}" minlength="3" maxlength="100" required></div><div class="mb-3"><label class="form-label" for="schoolId">School ID</label><input class="form-control" id="schoolId" name="schoolId" th:value="${schoolId}" maxlength="50" required></div><div class="mb-3"><label class="form-label" for="mobileNumber">Mobile number</label><input class="form-control" id="mobileNumber" name="mobileNumber" th:value="${mobileNumber}" maxlength="30" required></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" minlength="8" required></div><div class="mb-4"><label class="form-label" for="role">Role</label><select th:if="${canChooseRole}" class="form-select" id="role" name="role"><option th:each="role : ${T(com.discover.samples.webapp.entity.Role).values()}" th:value="${role}" th:text="${role}" th:selected="${role == selectedRole}"></option></select><input th:unless="${canChooseRole}" type="hidden" name="role" value="STUDENT"><input th:unless="${canChooseRole}" class="form-control" value="STUDENT" disabled></div><button class="btn btn-primary" type="submit">Submit for Approval</button></form></div></div></div></div></div></body></html>
