<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}">

<head>

    <title>Create User</title>

</head>

<body>

<div layout:fragment="content">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="d-flex align-items-center mb-4">

                <div>

                    <h1 class="h3 mb-1">

                        <i class="bi bi-person-plus"></i>

                        Create User

                    </h1>

                    <p class="text-muted mb-0">

                        Create a new administrator or staff account.

                    </p>

                </div>

            </div>


            <!-- ================================================= -->
            <!-- ERROR MESSAGE                                     -->
            <!-- ================================================= -->

            <div
                th:if="${error}"
                class="alert alert-danger">

                <i class="bi bi-exclamation-triangle"></i>

                <span th:text="${error}">
                    Error
                </span>

            </div>


            <!-- ================================================= -->
            <!-- FORM                                               -->
            <!-- ================================================= -->

            <div class="card shadow-sm">

                <div class="card-body">

                    <form
                        th:action="@{/users/new}"
                        method="post">

                        <!-- Username -->

                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label">

                                Username

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-person"></i>

                                </span>

                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    class="form-control"
                                    th:value="${username}"
                                    minlength="3"
                                    maxlength="100"
                                    autocomplete="username"
                                    required>

                            </div>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label">

                                Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-key"></i>

                                </span>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    minlength="8"
                                    autocomplete="new-password"
                                    required>

                            </div>

                            <div class="form-text">

                                Password must contain at least
                                8 characters.

                            </div>

                        </div>


                        <!-- Role -->

                        <div class="mb-4">

                            <label
                                for="role"
                                class="form-label">

                                Role

                            </label>

                            <select
                                id="role"
                                name="role"
                                class="form-select"
                                required>

                                <option
                                    value="STAFF"
                                    th:selected="${selectedRole == T(com.discover.samples.webapp.entity.Role).STAFF}">

                                    Staff

                                </option>

                                <option
                                    value="ADMIN"
                                    th:selected="${selectedRole == T(com.discover.samples.webapp.entity.Role).ADMIN}">

                                    Administrator

                                </option>

                            </select>

                        </div>


                        <!-- Buttons -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                <i class="bi bi-check-circle"></i>

                                Create User

                            </button>

                            <a
                                th:href="@{/dashboard}"
                                class="btn btn-outline-secondary">

                                <i class="bi bi-x-circle"></i>

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
