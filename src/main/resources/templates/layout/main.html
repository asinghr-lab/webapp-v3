<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title layout:title-pattern="$CONTENT_TITLE - RBAC-WebApp">RBAC-WebApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-primary"><div class="container-fluid">
  <a class="navbar-brand" th:href="@{/dashboard}"><i class="bi bi-shield-lock-fill"></i> RBAC-WebApp</a>
  <div class="d-flex align-items-center"><span class="text-white me-3" sec:authentication="name">username</span><form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm">Logout</button></form></div>
</div></nav>
<div class="container-fluid"><div class="row">
<aside class="col-md-3 col-lg-2 sidebar p-3">
  <a class="nav-link text-white mb-3" th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <section sec:authorize="hasRole('STUDENT')"><h6 class="sidebar-heading">STUDENT</h6><ul class="nav nav-pills flex-column">
    <li><a class="nav-link" th:href="@{/users/profile}">View Student Detail</a></li>
    <li><a class="nav-link" th:href="@{/users/profile}">Update Details</a></li>
    <li><a class="nav-link" th:href="@{/payments}">View Payments</a></li>
  </ul></section>
  <section sec:authorize="hasRole('STAFF')"><h6 class="sidebar-heading mt-3">STAFF</h6><ul class="nav nav-pills flex-column">
    <li><a class="nav-link" th:href="@{/users/profile}">View Staff Detail</a></li>
    <li><a class="nav-link" th:href="@{/users/students}">View Students</a></li>
  </ul></section>
  <section sec:authorize="hasRole('ADMIN')"><h6 class="sidebar-heading mt-3">ADMIN</h6><ul class="nav nav-pills flex-column">
    <li><a class="nav-link" th:href="@{/users/staff}">View All Staff</a></li>
    <li><a class="nav-link" th:href="@{/users/students}">View All Students</a></li>
  </ul></section>
</aside>
<main class="col-md-9 col-lg-10 px-md-4 py-4"><div layout:fragment="content"></div></main>
</div></div>
<footer class="border-top bg-white py-3"><div class="container-fluid text-center"><small class="text-muted">RBAC-WebApp</small></div></footer>
</body></html>
