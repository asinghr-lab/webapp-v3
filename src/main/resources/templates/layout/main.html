<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title layout:title-pattern="$CONTENT_TITLE - RBAC-WebApp">
        RBAC-WebApp
    </title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Application CSS -->
    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

    <!-- ====================================================== -->
    <!-- TOP NAVBAR                                             -->
    <!-- ====================================================== -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container-fluid">

            <a class="navbar-brand" th:href="@{/dashboard}">

                <i class="bi bi-shield-lock-fill"></i>

                RBAC-WebApp

            </a>

            <div class="d-flex align-items-center">

                <span class="text-white me-3">

                    <i class="bi bi-person-circle"></i>

                    <span sec:authentication="name">
                        username
                    </span>

                </span>

                <form th:action="@{/logout}" method="post">

                    <button type="submit" class="btn btn-outline-light btn-sm">

                        <i class="bi bi-box-arrow-right"></i>

                        Logout

                    </button>

                </form>

            </div>

        </div>

    </nav>


    <!-- ====================================================== -->
    <!-- APPLICATION BODY                                       -->
    <!-- ====================================================== -->

    <div class="container-fluid">

        <div class="row">

            <!-- ================================================== -->
            <!-- SIDEBAR                                            -->
            <!-- ================================================== -->

            <aside class="col-md-3 col-lg-2 sidebar p-3">

                <h6 class="sidebar-heading">
                    MENU
                </h6>

                <ul class="nav nav-pills flex-column">

                    <!-- Dashboard -->

                    <li class="nav-item">

                        <a class="nav-link" th:href="@{/dashboard}" th:classappend="${currentPage == 'dashboard'}
                           ? ' active'">

                            <i class="bi bi-speedometer2"></i>

                            Dashboard

                        </a>

                    </li>


                    <!-- Staff -->

                    <li class="nav-item">

                        <a class="nav-link" th:href="@{/users/staff}" th:classappend="${currentPage == 'staff'}
                           ? ' active'">

                            <i class="bi bi-people"></i>

                            Staff Users

                        </a>

                    </li>


                    <!-- ADMIN ONLY: Admin users -->

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">

                        <a class="nav-link" th:href="@{/users/admin}" th:classappend="${currentPage == 'admins'}
                           ? ' active'">

                            <i class="bi bi-person-badge"></i>

                            Admin Users

                        </a>

                    </li>


                    <!-- ADMIN ONLY: Add user -->

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">

                        <a class="nav-link" th:href="@{/users/new}" th:classappend="${currentPage == 'add-user'}
                           ? ' active'">

                            <i class="bi bi-person-plus"></i>

                            Add User

                        </a>

                    </li>

                </ul>

            </aside>


            <!-- ================================================== -->
            <!-- MAIN CONTENT                                        -->
            <!-- ================================================== -->

            <main class="col-md-9 col-lg-10 px-md-4 py-4">

                <div layout:fragment="content">

                    <!-- Page-specific content goes here -->

                </div>

            </main>

        </div>

    </div>


    <!-- ====================================================== -->
    <!-- FOOTER                                                 -->
    <!-- ====================================================== -->

    <footer class="border-top bg-white py-3">

        <div class="container-fluid text-center">

            <small class="text-muted">

                RBAC-WebApp &copy;
                <span th:text="${#dates.year(#dates.createNow())}">
                    2026
                </span>

            </small>

        </div>

    </footer>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Application JS -->

    <script th:src="@{/js/app.js}"></script>

</body>

</html>
